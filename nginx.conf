server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Retry-After "3600" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.svg {
        access_log off;
        try_files /favicon.svg =404;
    }

    location = /aico-maintenance-worker.webp {
        access_log off;
        try_files /aico-maintenance-worker.webp =404;
    }

    location = /index.html {
        internal;
    }

    error_page 503 /index.html;

    location / {
        return 503;
    }
}
